<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="contact.css" />

    <link rel="icon" href="logo.png" />

    <title>Contact</title>

    <!-- Font Awesome -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- =====================================================
         FORMULAIRE DE CONTACT
    ====================================================== -->

    <form id="contactForm">
      <h1>Contactez-nous</h1>

      <div class="separation"></div>

      <div class="groupe">
        <!-- =================================================
                 PARTIE GAUCHE
            ================================================== -->

        <div class="gauche">
          <!-- NOM -->

          <label for="name"> Nom </label>

          <input
            id="name"
            type="text"
            name="Nom"
            placeholder="Votre nom"
            autocomplete="name"
            required
            autofocus
          />

          <i class="fa-solid fa-circle-user" id="i1"></i>

          <!-- EMAIL -->

          <label for="email"> Adresse e-mail </label>

          <input
            id="email"
            type="email"
            name="Email"
            placeholder="exemple@email.com"
            autocomplete="email"
            required
          />

          <i class="fa-solid fa-envelope" id="i2"></i>
        </div>

        <!-- =================================================
                 PARTIE DROITE
            ================================================== -->

        <div class="droite">
          <!-- SUJET -->

          <label for="subject"> Sujet </label>

          <input
            id="subject"
            type="text"
            name="Sujet"
            placeholder="Sujet"
            required
          />

          <!-- MESSAGE -->

          <label for="message"> Message </label>

          <textarea
            id="message"
            name="Message"
            placeholder="Saisissez votre message..."
            required
          ></textarea>

          <!-- BOUTON -->

          <input id="button" type="submit" value="Envoyer" />
        </div>
      </div>
    </form>

    <!-- =====================================================
         RETOUR
    ====================================================== -->

    <button id="retour" type="button">
      <i class="fa-solid fa-long-arrow-left"></i>

      Retour
    </button>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>
      /* =====================================================
           FORMULAIRE
        ===================================================== */

      const contactForm = document.getElementById("contactForm");

      contactForm.addEventListener("submit", (event) => {
        event.preventDefault();

        /* Récupération des champs */

        const name = document.getElementById("name").value.trim();

        const emailInput = document.getElementById("email");

        const email = emailInput.value.trim();

        const subject = document.getElementById("subject").value.trim();

        const message = document.getElementById("message").value.trim();

        /* Vérification */

        if (!name || !email || !subject || !message) {
          alert("Veuillez remplir tous les champs.");

          return;
        }

        /* Vérification email */

        if (!emailInput.checkValidity()) {
          alert("Veuillez entrer une adresse e-mail valide.");

          emailInput.focus();

          return;
        }

        /* =================================================
               CONTENU DU MAIL
            ================================================== */

        const emailBody =
          `Nom : ${name}\n\n` +
          `Adresse e-mail : ${email}\n\n` +
          `Sujet : ${subject}\n\n` +
          `Message :\n${message}`;

        /* =================================================
               DESTINATION
            ================================================== */

        const destination = "medagdev@outlook.com";

        /* =================================================
               MAILTO
            ================================================== */

        const mailto =
          `mailto:${destination}` +
          `?subject=${encodeURIComponent(subject)}` +
          `&body=${encodeURIComponent(emailBody)}`;

        window.location.href = mailto;
      });

      /* =====================================================
           BOUTON RETOUR
        ===================================================== */

      const retour = document.getElementById("retour");

      retour.addEventListener("click", () => {
        window.location.href = "accueil.html";
      });
    </script>
  </body>
</html>
