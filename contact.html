<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="contact.css" />
    <link rel="icon" href="logo.png" />

    <title>Contact</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <form id="contactForm">
      <h1>Contactez-nous</h1>

      <div class="separation"></div>

      <div class="groupe">
        <div class="gauche">
          <label for="name">Nom</label>

          <input id="name" type="text" name="Nom" required autofocus />

          <i class="fa-solid fa-circle-user" id="i1"></i>

          <label for="age">Âge</label>

          <input
            id="age"
            type="number"
            name="Âge"
            required
            min="5"
            max="100"
            step="1"
          />

          <i class="fa-solid fa-calendar" id="i2"></i>

          <label for="email">Email</label>

          <i class="fa-solid fa-envelope" id="i3"></i>

          <input id="email" type="email" name="Email" required />

          <label for="continent">Continent</label>

          <select id="continent" name="Continent" required>
            <option value="Afrique">Afrique</option>
            <option value="Europe">Europe</option>
            <option value="Asie">Asie</option>
            <option value="Amerique">Amérique</option>
            <option value="Oceanie">Océanie</option>
          </select>

          <i class="fa-solid fa-globe" id="i4"></i>
        </div>

        <div class="droite">
          <!-- SUJET -->

          <label for="subject">Sujet</label>

          <input
            id="subject"
            type="text"
            name="Sujet"
            placeholder="Sujet"
            required
          />

          <!-- MESSAGE -->

          <label for="message">Message</label>

          <textarea
            id="message"
            placeholder="Saisissez ici..."
            name="Message"
            required
          ></textarea>

          <input id="button" type="submit" value="Envoyer" />
        </div>
      </div>
    </form>

    <button id="retour">
      <i class="fa-solid fa-long-arrow-left"></i>
      Retour
    </button>

    <script>
      /* =========================================================
       FORMULAIRE DE CONTACT
       ========================================================= */

      const contactForm = document.getElementById("contactForm");

      contactForm.addEventListener("submit", (event) => {
        event.preventDefault();

        /* Récupération des champs */

        const name = document.getElementById("name").value.trim();

        const age = document.getElementById("age").value.trim();

        const emailInput = document.getElementById("email");

        const email = emailInput.value.trim();

        const continent = document.getElementById("continent").value;

        const subject = document.getElementById("subject").value.trim();

        const message = document.getElementById("message").value.trim();

        /* Vérification */

        if (!name || !age || !email || !continent || !subject || !message) {
          alert("Veuillez remplir tous les champs.");
          return;
        }

        /* Vérification de l'adresse e-mail */

        if (!emailInput.checkValidity()) {
          alert("Veuillez entrer une adresse e-mail valide.");

          emailInput.focus();

          return;
        }

        /* =======================================================
         CONTENU DU MAIL
         ======================================================= */

        const emailBody =
          `Nom : ${name}\n` +
          `Âge : ${age}\n` +
          `Email : ${email}\n` +
          `Continent : ${continent}\n\n` +
          `Message :\n${message}`;

        /* =======================================================
         OUVERTURE DE LA BOÎTE MAIL
         ======================================================= */

        const destination = "medagdev@outlook.com";

        const mailto =
          `mailto:${destination}` +
          `?subject=${encodeURIComponent(subject)}` +
          `&body=${encodeURIComponent(emailBody)}`;

        window.location.href = mailto;
      });

      /* =========================================================
       BOUTON RETOUR
       ========================================================= */

      const retour = document.getElementById("retour");

      retour.addEventListener("click", (event) => {
        event.preventDefault();

        window.location.href = "accueil.html";
      });
    </script>
  </body>
</html>
