<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Déconnexion</title>
<link rel="icon" href="logo.png">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    overflow-y:auto;
}

.container{
    background:white;
    width:100%;
    max-width:450px;
    border-radius:15px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.icon{
    font-size:60px;
    text-align:center;
    margin-bottom:15px;
}

h1{
    text-align:center;
    margin-bottom:15px;
    color:#222;
}

p{
    color:#555;
    line-height:1.7;
    margin-bottom:15px;
}

.info{
    background:#f1f5ff;
    border-left:4px solid #3b82f6;
    padding:15px;
    border-radius:8px;
    margin:20px 0;
    font-size:15px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:25px;
}

button{
    flex:1;
    border:none;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    transition:.2s;
}

.cancel{
    background:#e5e7eb;
}

.cancel:hover{
    background:#d1d5db;
}

.logout{
    background:#ef4444;
    color:white;
}

.logout:hover{
    background:#dc2626;
}
/* Responsive */

@media (max-width: 480px){

    .container{
        padding:20px;
        border-radius:12px;
    }

    .icon{
        font-size:50px;
    }

    h1{
        font-size:24px;
    }

    p,
    .info,
    li{
        font-size:14px;
    }

    button{
        padding:12px;
        font-size:15px;
    }

    .buttons{
        flex-direction:column;
    }

    .buttons button{
        width:100%;
    }

}
</style>
</head>

<body>

<div class="container">

<div class="icon">👋</div>

<h1>Se déconnecter ?</h1>

<p>
Vous êtes sur le point de vous déconnecter de votre compte.
</p>

<div class="info">
Après la déconnexion :
<ul style="margin-top:10px;margin-left:20px;">
<li>Vous devrez vous reconnecter pour accéder à vos notes.</li>
<li>Vos notes ne seront pas supprimées.</li>
<li>Vos données enregistrées resteront disponibles après votre prochaine connexion.</li>
</ul>
</div>

<div class="buttons">
<button class="cancel" onclick="history.back()">
Annuler
</button>

<button class="logout" onclick="logout()">
Se déconnecter
</button>
</div>

</div>

<script>
function logout(){

    // Supprime les données de connexion
    localStorage.removeItem("name");
    localStorage.removeItem("email");
    
    window.location.href="index.html";
    
}
</script>

</body>
</html>
